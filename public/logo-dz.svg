<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Star Song DZ">
  <defs>
    <radialGradient id="shine" cx=".3" cy=".25" r=".85">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#d89a12"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="116"/></clipPath>
    <clipPath id="disc"><circle cx="256" cy="256" r="178"/></clipPath>
  </defs>
  <!-- fond : le drapeau algérien, vert et blanc -->
  <g clip-path="url(#tile)">
    <rect width="256" height="512" fill="#006233"/>
    <rect x="256" width="256" height="512" fill="#ffffff"/>
    <rect width="512" height="512" fill="url(#shine)"/>
  </g>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#d21034" stroke-width="12"/>
  <!-- le vinyle noir, cerclé d'or -->
  <circle cx="256" cy="256" r="186" fill="url(#gold)"/>
  <circle cx="256" cy="256" r="178" fill="#0e0e10"/>
  <g clip-path="url(#disc)" fill="none" stroke="#26262b" stroke-width="3">
    <circle cx="256" cy="256" r="160"/><circle cx="256" cy="256" r="146"/><circle cx="256" cy="256" r="132"/>
    <circle cx="256" cy="256" r="118"/><circle cx="256" cy="256" r="104"/>
  </g>
  <path d="M120 170 A 160 160 0 0 1 210 104" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="10" stroke-linecap="round"/>
  <!-- l'étiquette : l'emblème du drapeau (croissant et étoile rouges sur fond blanc) -->
  <circle cx="256" cy="256" r="88" fill="#ffffff"/>
  <circle cx="256" cy="256" r="88" fill="none" stroke="#006233" stroke-width="8"/>
  <path fill="#d21034" fill-rule="evenodd" d="M256 206 a50 50 0 1 0 0 100 a50 50 0 1 0 0 -100 Z M270 214 a40 40 0 1 1 0 84 a40 40 0 1 1 0 -84 Z"/>
  <path d="M234.0 256.0 L259.9 247.2 L260.3 219.9 L276.6 241.7 L302.7 233.7 L287.0 256.0 L302.7 278.3 L276.6 270.3 L260.3 292.1 L259.9 264.8 Z" fill="#d21034" stroke="#d21034" stroke-width="4" stroke-linejoin="round"/>
</svg>
